# Todos los valores son SUPUESTOS ilustrativos (órdenes de magnitud), no cifras de literatura.
# Sustituir por valores con referencia verificada antes de cualquier conclusión.
semilla: {valor: 20261020, fuente: supuesto}
tarea:
