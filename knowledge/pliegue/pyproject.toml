[project]
name = "warpcalc"
version = "0.1.0"
description = "Cálculos numéricos de densidad de energía en métricas de Alcubierre y Natário y efectos relativistas medibles"
authors = [{name = "Lázaro López Paz"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["warpcalc"]
