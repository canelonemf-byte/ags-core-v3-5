name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  py_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # skip heavy optional
          pip install pytest pytest-asyncio httpx -q
      - name: Compilar módulos Python
        run: |
          set -e
          mapfile -t files < <(find . -name '*.py' -not -path './.git/*' -not -path './.venv/*' -not -path './venv/*' -not -path '*/__pycache__/*' -not -path './knowledge/*')
          python -m py_compile "${files[@]}"
          echo "py_compile OK (${#files[@]} archivos)"
      - name: Tests (sin gemini externo)
        env:
          AGS_API_KEY: test-key
          PYTHONPATH: app
        run: |
          python -m pytest -q --ignore=tests/test_gemini_agent.py
